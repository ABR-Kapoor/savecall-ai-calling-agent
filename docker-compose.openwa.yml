# ==============================================================================
# InsurCall - Upstream OpenWA WhatsApp Gateway (Pinned v0.25.0)
# Pinned Commit: a32cfbadd8543d57606a598711f8590ccf748640
# Upstream Repository: https://github.com/rmyndharis/OpenWA
# ==============================================================================

services:
  openwa:
    image: ghcr.io/rmyndharis/openwa:v0.25.0
    container_name: insurcall-openwa
    restart: unless-stopped
    ports:
      - "127.0.0.1:2785:2785"
    environment:
      - PORT=2785
      - API_KEY=${OPENWA_API_KEY:?OPENWA_API_KEY must be configured}
      - DEFAULT_ENGINE=baileys
      - DATABASE_TYPE=sqlite
      - DATABASE_SYNCHRONIZE=true
      - LOG_LEVEL=info
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - BASE_URL=http://localhost:2785
      - STATUS_SEED_ON_READY=false
      - SHUTDOWN_DELAY_MS=3000
    volumes:
      - openwa-data:/app/data
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2785/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  openwa-data:
    name: insurcall-openwa-data
